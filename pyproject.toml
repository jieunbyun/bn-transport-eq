[project]
name = "bn-transport-eq"
version = "0.1.0"
description = "Transport networks under seismic risk as Bayesian networks: schema, instances, builder, inference, language, app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.0",
    "ndtools-duco>=0.1.10",
    "networkx>=3.4",
    "numpy>=2.4.6",
    "pip>=26.2.1",
    "pytest>=9.1.1",
    "scipy>=1.17.1",
    "torch>=2.0",
    "tbnpy>=0.3.5",
    "rsr-duco>=0.3.1",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.13.0",
]
