function currentScenario() {
  const deepMerge = (a, b) => {
    const out = structuredClone(a);
    for (const [k, v] of Object.entries(b)) out[k] = v && typeof v === "object" && !Array.isArray(v)
      ? deepMerge(out[k] || {}, v) : v;
    return out;
  };
  // A picked earthquake replaces the session's: its version is left open (null) unless one was asked for. With no
  // pick, Run stays on the session's earthquake and the version it ran (the revised-map notice offers a newer one),
  // not the example's default event.
  const m = state.session?.shakemap;
  const q = state.pick ? { event_id: state.pick.event_id, version: state.pick.version ?? null }
          : m ? { event_id: m.event_id, version: m.version } : null;
  const pick = q && isShakemap() ? { parameters: { [SHAKEMAP]: q } } : {};
  return deepMerge(deepMerge(state.preset, interventions()), pick);
}

function applyScenarioControls() {
  renderControls();
}

// ---- the session: decision queries and evidence, and the roadmap of the discussion --------------------------
// The server keeps one posterior session per example (src/inference/session.py): samples of the whole BN given the
// evidence so far. A decision query (a target, and a kind of decision) and an observation are added
// from the header's two windows; each addition is an entry on the roadmap, with every query against the step before.

const post = (url, body) => getJSON(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const short = v => v.split("::")[1];
const share = x => `${(100 * x).toFixed(x < 0.1 ? 1 : 0)}%`;

async function loadSession(id, epoch) {
  const session = (await getJSON(`/api/session?assembly=${encodeURIComponent(id)}`)).session;
  if (epoch !== state.epoch) return false;
  state.preset = session?.scenario || {};
  $("#samples").value = session?.n || 200000;
  showSession(session);
  return true;
}

function evidenceText(ev, s) {
  const kind = s.variables[ev.variable]?.kind, at = short(ev.variable);
  const text = { reading: `the station at ${at} reads ${ev.label}`, edge: `${at} is ${ev.label}`,
                 system: `${at} ${ev.label === "Fail" ? "is cut off" : "has access"}`, damage: `${at}: ${ev.label} damage` }[kind]
    || `${ev.variable} = ${ev.label}`;
  return text + (ev.source ? ` (${ev.source})` : "");
}

function targetText(target, s) {
  return { cut_off: `expected ${s.unit} cut off from a key destination`,
           cut_off_at_least: `probability that at least ${target.at_least} ${s.unit} are cut off`,
           fail: `probability that ${target.origin} is cut off`, closed: `probability that ${target.edge} is closed` }[target.kind];
}

function queryChart(q, now, prev, s, added) {
  // A tracked target: one row. Inspection priority: one row per bridge not yet observed, what inspecting it (and
  // repairing it if damaged) gives back, largest first. Each row: the step before (grey) over this step (blue), on one
  // scale per query; a new query, or a bridge just observed, has no step before.
  const counts = q.target.kind === "cut_off", fmt = x => counts ? x.toFixed(2) : x.toFixed(3);
  const keys = Object.keys(now).sort((a, b) => q.decision === "inspect" ? now[b][0] - now[a][0] : 0);
  const top = Math.max(1e-9, ...keys.flatMap(k => [now[k][0], prev?.[k]?.[0] ?? 0]));
  const rows = keys.map(k => {
    const n = now[k], p = prev?.[k], w = x => Math.max(0, 100 * x / top);
    return `<div class="opt"><span class="lab" title="${esc(k)}">${esc(q.decision === "inspect" ? k : "now")}</span><span class="bars">` +
      (p ? `<span class="bar prev" style="width:${w(p[0])}%"></span>` : "") +
      `<span class="bar now" style="width:${w(n[0])}%"></span></span>` +
      `<span class="num" title="± ${fmt(n[1])} (1 SE)">${p ? `<span class="was">${fmt(p[0])} →</span> ` : ""}${fmt(n[0])}</span></div>`;
  }).join("") || `<p class="meta">Every bridge has been observed.</p>`;
  const unit = q.decision === "inspect"
    ? `${counts ? `${s.unit} given back` : "reduction in the " + targetText(q.target, s)} by inspecting each bridge (and repairing it if damaged)`
    : targetText(q.target, s);
  return `<div class="qchart${added ? " new" : ""}"><h4>${esc(q.name)}</h4><div class="unit">${esc(unit)}</div>${rows}</div>`;
}

function computationTime(seconds) {
  if (!Number.isFinite(seconds) || seconds < 0) return "computation time not recorded";
  if (seconds < 0.001) return "computed in <1 ms";
  return `computed in ${seconds < 1 ? `${Math.round(seconds * 1000)} ms` : `${seconds.toFixed(2)} s`}`;
}

function roadEntry(e, prev, s) {
  const what = { start: "Session started", query: "Decision query added", evidence: "Evidence added" }[e.kind];
  const text = e.kind === "evidence" ? evidenceText({...e.evidence}, s) : e.kind === "query" ? e.query.name : "no evidence yet";
  const how = e.kind === "evidence" ? `${e.update}: ${share(e.ess)} of the weight was left` : e.kind === "start" ? `${s.n.toLocaleString()} samples` : "";
  const queries = s.queries.filter(q => e.values[q.id]);
  const bubble = queries.length ? `<div class="bubble">${queries.map(q =>
    queryChart(q, e.values[q.id], prev?.values?.[q.id], s, e.kind === "query" && e.query.id === q.id)).join("")}</div>` : "";
  return `<div class="road-entry ${e.kind}"><div class="road-head"><time>${esc(e.at)}</time><span class="what">${what}:</span> ` +
    `${esc(text)}${how ? `<span class="how">${esc(how)}</span>` : ""}` +
    `<span class="duration">· ${esc(computationTime(e.elapsed_s))}</span></div>${bubble}</div>`;
}

function renderRoadmap() {
  const s = state.session;
  if (!s) {
    $("#road-start").innerHTML = `<p class="meta">Press Run to start: the clique tree samples the whole BN under the ` +
      `scenario settings, with no evidence yet. Decision queries and evidence are then added in the two panels under the ` +
      `map; each addition appears here, with every decision query against the step before.</p>`;
    $("#road").innerHTML = "";
    return;
  }
  $("#road-start").innerHTML = `<div class="road-key"><span><i style="background:var(--idle)"></i>the step before</span>` +
    `<span><i style="background:var(--accent)"></i>this step</span><span>${Object.keys(s.evidence).length} observation(s), ` +
    `${s.queries.length} decision quer${s.queries.length === 1 ? "y" : "ies"}; ${share(s.ess)} of the samples' weight effective</span></div>`;
  $("#road").innerHTML = s.timeline.map((e, i) => roadEntry(e, s.timeline[i - 1], s)).reverse().join("");
  $("#pane-roadmap").scrollTop = 0;
}

// The session's numbers are the map's: after Run and after every addition, the map and results show them.
function showSession(s) {
  state.session = s;
  state.result = s ? s.result : null;
  renderRoadmap(); preparePanels(); renderMap(); renderResults(); renderQuakeLine();
  checkShakemapVersion();
}

const inferenceRequests = new Map();

function updateInferenceStop() {
  const requests = [...inferenceRequests.values()], stopping = requests.length && requests.every(r => r.stopping);
  $("#stop").disabled = !requests.length || stopping;
  $("#stop").textContent = stopping ? "Stopping…" : "Stop";
}

async function stopInference() {
  await Promise.all([...inferenceRequests.values()].filter(r => !r.stopping).map(async request => {
    request.stopping = true;
    updateInferenceStop();
    if (request.epoch === state.epoch) setStatus("Stopping inference…");
    try {
      await post("/api/session/stop", {request_id: request.id});
    } catch (err) {
      if (inferenceRequests.has(request.id)) {
        request.stopping = false;
        if (request.epoch === state.epoch) setStatus(`Could not stop inference: ${err.message}`, true);
      }
    } finally { updateInferenceStop(); }
  }));
}

async function sessionCall(url, body, busy) {
  const epoch = state.epoch, assembly = state.ex.assembly.id;
  const request = {id: crypto.randomUUID(), epoch, stopping: false};
  inferenceRequests.set(request.id, request);
  updateInferenceStop();
  setStatus(busy);
  try {
    const session = await post(url, {assembly, ...body, request_id: request.id});
    if (epoch !== state.epoch) return false;
    showSession(session);
    setStatus(`${state.session.n.toLocaleString()} samples, ${share(state.session.ess)} of their weight effective, ${state.result.elapsed_s.toFixed(1)} s.`);
    return true;
  } catch (err) {
    if (err.cancelled) {
      if (epoch === state.epoch) setStatus("Inference stopped. Last completed results kept.");
      return false;
    }
    if (epoch === state.epoch) setStatus(err.message, true);
    throw err;
  } finally {
    inferenceRequests.delete(request.id);
    updateInferenceStop();
  }
}

// Run: a new session under the scenario settings (Assumptions), sampled with no evidence.
async function run() {
  if (state.loading || panelBusy) return;
  const epoch = state.epoch;
  const samples = Math.round(Number($("#samples").value) || 200000);
  setPanelBusy(true);
  try {
    const fetching = state.pick || (isShakemap() && !state.session) ? "Fetching the ShakeMap and sampling" : "Sampling";
    if (await sessionCall("/api/session", {scenario: currentScenario(), samples},
                          `${fetching} ${samples.toLocaleString()}…`)) {
      resetConversation();
      preparePanels();
      saveConversation();
    }
  } catch (err) {
    // A picked earthquake that cannot run leaves the previous session on screen: say so, or the page seems to
    // have ignored the pick.
    const m = state.session?.shakemap;
    if (epoch === state.epoch && state.pick && !err.cancelled)
      setStatus(`Could not run ShakeMap ${state.pick.event_id}: ${err.message}.` +
                (m ? ` Still showing ${m.event_id} v${m.version}.` : ""), true);
  } finally {
    if (epoch === state.epoch) {
      // Run or not, the line and the map go back to the session on screen; a failure is in the status line.
      state.pick = null;
      renderQuakeLine(); renderMap();
      setPanelBusy(false);
    }
  }
}


// ---- decision task and observation entry ---------------------------------------------------------------
const pending = { query: null, evidence: null };
let panelBusy = false, agentReady = false;
const messages = { query: [], evidence: [] };
const observationUI = { mode: "form", kind: "reading", variable: "", value: "", source: "" };

// Add further tasks here; the task selector and its active state are rendered from this catalogue.
const DECISION_TASKS = [{
  id: "inspection-access", title: "Prioritise bridge inspection",
  description: unit => `Maximise the number of ${unit} with access to key destinations. Repair inspected bridges if damaged.`,
  query: unit => ({name: `Inspection priority for ${unit === "people" ? "people's" : "towns'"} access`,
                   target: {kind: "cut_off"}, decision: "inspect"}),
}];

function taskUnit() {
  return state.session?.unit || ((state.ex?.network?.tables?.Node || []).some(n => n.population != null) ? "people" : "towns");
}

function activeTaskQuery(task) {
  const spec = task.query(taskUnit());
  return state.session?.queries.find(q => q.decision === spec.decision && JSON.stringify(q.target) === JSON.stringify(spec.target));
}

function renderDecisionTasks() {
  const box = $("#decision-tasks");
  box.innerHTML = "";
  for (const task of DECISION_TASKS) {
    const active = activeTaskQuery(task), button = document.createElement("button");
    button.type = "button";
    button.className = "task-card";
    button.dataset.task = task.id;
    button.setAttribute("aria-pressed", String(!!active));
    button.innerHTML = `<strong>${esc(task.title)}</strong><span>${esc(task.description(taskUnit()))}</span>` +
      `<span class="task-state">${active ? "Active task" : "Select task"}</span>`;
    button.onclick = () => selectDecisionTask(task.id);
    box.append(button);
  }
  const active = DECISION_TASKS.map(activeTaskQuery).find(Boolean);
  $("#task-summary").textContent = active ? formulation("query", active).split("\n").slice(1).join("\n") : "";
  $("#task-status").textContent = !state.session ? "Press Run to start a session." : active
    ? "Priorities update whenever an observation is added." : "";
}

async function selectDecisionTask(id) {
  const task = DECISION_TASKS.find(t => t.id === id);
  if (!task || !state.session || state.loading || panelBusy || activeTaskQuery(task)) return;
  const epoch = state.epoch;
  setPanelBusy(true);
  try {
    await sessionCall("/api/session/query", {query: task.query(taskUnit())}, "Computing inspection priorities…");
  } catch (err) {
    if (epoch === state.epoch) $("#task-status").textContent = err.message;
  } finally {
    if (epoch === state.epoch) { setPanelBusy(false); saveConversation(); }
  }
}

const OBSERVATION_KINDS = {reading: "Ground-motion reading", damage: "Bridge damage", edge: "Road status", system: "Town access"};

function observationVariables(kind) {
  return Object.entries(state.session?.variables || {}).filter(([name, v]) => v.kind === kind && !(name in state.session.evidence))
    .sort(([a], [b]) => a.localeCompare(b, undefined, {numeric: true}));
}

function renderObservationFields() {
  const kinds = Object.keys(OBSERVATION_KINDS).filter(kind => observationVariables(kind).length);
  if (!kinds.includes(observationUI.kind)) Object.assign(observationUI, {kind: kinds[0] || "", variable: "", value: ""});
  $("#observation-kind").innerHTML = kinds.map(kind => `<option value="${kind}">${OBSERVATION_KINDS[kind]}</option>`).join("") ||
    '<option value="">No unobserved assets available</option>';
  $("#observation-kind").value = observationUI.kind;
  const variables = observationVariables(observationUI.kind);
  if (!variables.some(([name]) => name === observationUI.variable))
    Object.assign(observationUI, {variable: variables[0]?.[0] || "", value: ""});
  $("#observation-variable").innerHTML = variables.map(([name]) => `<option value="${esc(name)}">${esc(short(name))}</option>`).join("");
  $("#observation-variable").value = observationUI.variable;
  const meta = state.session?.variables[observationUI.variable], reading = meta?.states === null;
  $("#observation-reading").hidden = $("#observation-reading-label").hidden = !reading;
  $("#observation-value").hidden = $("#observation-value-label").hidden = reading;
  $("#observation-reading").value = reading ? observationUI.value : "";
  const states = meta?.states || [];
  if (!reading && !states.includes(observationUI.value)) observationUI.value = states[0] || "";
  const label = value => observationUI.kind === "system" ? ({Fail: "No access", Survival: "Has access"}[value] || value) : value;
  $("#observation-value").innerHTML = states.map(value => `<option value="${esc(value)}">${esc(label(value))}</option>`).join("");
  $("#observation-value").value = reading ? "" : observationUI.value;
  $("#observation-source").value = observationUI.source;
}

function rememberObservationFields() {
  observationUI.kind = $("#observation-kind").value;
  observationUI.variable = $("#observation-variable").value;
  const reading = state.session?.variables[observationUI.variable]?.states === null;
  observationUI.value = $(reading ? "#observation-reading" : "#observation-value").value;
  observationUI.source = $("#observation-source").value;
}

function setObservationMode(mode) {
  observationUI.mode = mode === "chat" ? "chat" : "form";
  $("#observation-form").hidden = observationUI.mode !== "form";
  $("#observation-chat").hidden = observationUI.mode !== "chat";
  for (const button of document.querySelectorAll("[data-observation-mode]"))
    button.setAttribute("aria-pressed", String(button.dataset.observationMode === observationUI.mode));
  saveConversation();
}

function observationFromFields() {
  const variable = observationUI.variable, meta = state.session?.variables[variable];
  if (!meta || variable in state.session.evidence) throw new Error("Choose an unobserved asset.");
  let value = observationUI.value;
  if (meta.states === null) {
    if (String(value).trim() === "" || !Number.isFinite(Number(value)) || Number(value) < 0)
      throw new Error("Enter a finite, nonnegative reading in g.");
    value = Number(value);
  } else if (!meta.states.includes(value)) throw new Error("Choose an observed state.");
  return {variable, value, source: observationUI.source.trim() || undefined};
}

async function submitObservation() {
  if (!state.session || state.loading || panelBusy) return;
  const epoch = state.epoch;
  $("#observation-error").textContent = "";
  try {
    rememberObservationFields();
    const d = observationFromFields();
    setPanelBusy(true);
    pending.evidence = d;
    await say("evidence", "user", formulation("evidence", d));
    if (await addPending("evidence")) {
      observationUI.value = "";
      renderObservationFields();
    }
  } catch (err) {
    if (epoch === state.epoch) $("#observation-error").textContent = err.message;
  } finally {
    if (epoch === state.epoch) { setPanelBusy(false); saveConversation(); }
  }
}

function updatePanelControls() {
  updateInferenceStop();
  const blocked = !state.session || state.loading || panelBusy;
  $("#run").disabled = $("#new-session").disabled = !state.ex || state.loading || panelBusy;
  for (const button of $("#decision-tasks").querySelectorAll("button")) {
    const task = DECISION_TASKS.find(t => t.id === button.dataset.task);
    button.disabled = blocked || !!activeTaskQuery(task);
  }
  for (const input of $("#observation-form").querySelectorAll("input, select, button"))
    input.disabled = blocked || !observationUI.variable || input.hidden;
  $("#e-words").disabled = blocked || !agentReady;
  $("#e-words").closest("form").querySelector("button").disabled = blocked || !agentReady;
  $("#e-confirm").hidden = !pending.evidence;
  $("#e-confirm").disabled = blocked;
}

function setPanelBusy(active) { panelBusy = active; updatePanelControls(); }

function conversationKey() {
  const s = state.session;
  return s ? JSON.stringify([s.n, s.timeline[0], s.timeline.length, s.timeline.at(-1)?.at]) : null;
}

function saveConversation() {
  if (state.loading || !state.ex || !state.session) return;
  store.set(`conversation:${state.ex.assembly.id}`, JSON.stringify({
    session: conversationKey(), messages, talk, pending,
    words: { evidence: $("#e-words").value }, observation: observationUI,
    scenario: currentScenario(), samples: $("#samples").value,
  }));
}

function resetConversation() {
  for (const kind of ["query", "evidence"]) {
    messages[kind] = []; talk[kind] = []; pending[kind] = null;
  }
  $("#e-talk").innerHTML = "";
  $("#e-words").value = "";
  $("#observation-error").textContent = $("#observation-status").textContent = "";
  Object.assign(observationUI, {mode: "form", kind: "reading", variable: "", value: "", source: ""});
}

function restoreConversation() {
  let saved = null;
  try { saved = JSON.parse(store.get(`conversation:${state.ex.assembly.id}`)); } catch {}
  resetConversation();
  if (saved?.session === conversationKey() && saved?.messages) {
    for (const kind of ["evidence"]) {
      for (const m of saved.messages[kind] || []) say(kind, m.who, m.text, m.choices, false, false);
      messages[kind] = saved.messages[kind] || [];
      talk[kind] = saved.talk[kind] || [];
      pending[kind] = saved.pending[kind];
      $("#e-words").value = saved.words.evidence || "";
    }
    Object.assign(observationUI, saved.observation || {});
    state.preset = saved.scenario || state.preset;
    $("#samples").value = saved.samples;
  } else if (state.session) {
    // Older sessions may have a timeline without a saved chat. Show the actual recorded observations.
    for (const entry of state.session.timeline) {
      if (entry.kind !== "evidence") continue;
      say("evidence", "user", entry.text || evidenceText(entry.evidence, state.session), undefined, false, false);
      say("evidence", "agent", `Added (${entry.update}).`, undefined, false, false);
    }
  } else {
    say("evidence", "agent", "Press Run first.", undefined, false, false);
  }
  renderObservationFields();
  setObservationMode(observationUI.mode);
  updatePanelControls();
}

// The draft written out exactly, by the page from the draft itself (not by the model).
function formulation(kind, d) {
  const s = state.session;
  if (kind === "evidence") {
    const value = typeof d.value === "number" ? `${d.value} g` : d.value;
    return `Evidence: ${d.variable} = ${value}${d.source ? ` (source: ${d.source})` : ""}`;
  }
  const t = d.target || {}, w = s.unit === "people" ? "pop_k · " : "";
  const of = given => ({
    cut_off: `Σ_k ${w}P(S_k = Fail | ${given})`,
    cut_off_at_least: `P(Σ_k ${w}1[S_k = Fail] ≥ ${t.at_least} | ${given})`,
    fail: `P(S_${t.origin} = Fail | ${given})`,
    closed: `P(E_${t.edge} = closed | ${given})`,
  })[t.kind];
  const head = `Decision query "${d.name || "decision"}":`;
  if (d.decision !== "inspect") return `${head}\n${of("ev")}`;
  const after = t.kind === "cut_off"
    ? `Σ_k Σ_x P(D_i = x | ev) · ${w}P(S_k = Fail | do(E_i = open), ev, D_i = x)`
    : `Σ_x P(D_i = x | ev) · ${of("do(E_i = open), ev, D_i = x")}`;
  return `${head} for each bridge i not yet observed,\nVOI_i = ${of("ev")} − ${after}`;
}

function preparePanels() {
  renderDecisionTasks();
  renderObservationFields();
  setObservationMode(observationUI.mode);
  updatePanelControls();
  const reading = observationVariables("reading")[0]?.[0];
  $("#e-words").placeholder = reading ? `e.g. The station at ${short(reading)} reads 0.8 g` : "Describe the asset, observed state or reading, and source";
}

async function addPending(kind, animate = false) {
  if (kind !== "evidence" || !pending.evidence) return false;
  const d = pending[kind], epoch = state.epoch;
  try {
    const added = await sessionCall("/api/session/evidence", {variable: d.variable, value: d.value, source: d.source || undefined,
                           at: new Date().toTimeString().slice(0, 8)},
                           "Taking the observation in: reweighting, or sampling again if too little weight is left…");
    if (!added) return false;
    pending.evidence = null;
    const acknowledgement = `Added (${state.session.timeline.at(-1).update}).`;
    $("#observation-status").textContent = acknowledgement;
    await say(kind, "agent", acknowledgement, undefined, animate);
    if (epoch !== state.epoch) return false;
    talk[kind] = [];
    saveConversation();
    return true;
  } catch (e) {
    if (epoch === state.epoch) { $("#observation-error").textContent = e.message; say(kind, "error", e.message); }
    return false;
  }
}

// The agent: each panel is a short conversation. The questioner writes; the agent drafts, shown as its exact
// formulation, or asks what the sentence leaves open, with choices. Nothing is added until the questioner says yes.
const talk = { query: [], evidence: [] };
async function say(kind, who, text, choices, animate = false, remember = true) {
  if (kind !== "evidence") return;
  const epoch = state.epoch;
  const box = $("#e-talk"), el = document.createElement("div");
  for (const b of box.querySelectorAll(".choices button")) b.disabled = true;
  messages[kind].push({who, text, choices});
  if (remember) saveConversation();
  el.className = `said ${who === "user" ? "user" : "agent"}${who === "error" ? " err" : ""}`;
  box.append(el);
  const scroll = () => { box.scrollTop = box.scrollHeight; };
  if (animate) {
    el.setAttribute("aria-busy", "true");
    if (who === "agent") {
      el.setAttribute("aria-label", "Agent is typing");
      el.innerHTML = '<span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>';
      scroll();
      await pause(500);
      if (epoch !== state.epoch || !el.isConnected) return;
      el.removeAttribute("aria-label");
    }
    el.textContent = "";
    el.classList.add("typing");
    // Reveal exactly one character per tick, even for long replies. Reduced motion disables the CSS
    // dots/caret animation, while preserving character-by-character typing.
    for (const character of Array.from(text)) {
      if (epoch !== state.epoch || !el.isConnected) return;
      el.textContent += character;
      scroll();
      await pause(35);
    }
    el.classList.remove("typing");
    el.removeAttribute("aria-busy");
  }
  if (epoch !== state.epoch || !el.isConnected) return;
  el.textContent = text;
  if (choices?.length) {
    const list = document.createElement("div");
    list.className = "choices";
    for (const c of choices) {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = esc(c.label) + (c.definition ? `<span>${esc(c.definition)}</span>` : "");
      b.onclick = () => { for (const x of list.querySelectorAll("button")) x.disabled = true;
                          draft(kind, c.definition ? `${c.label}: ${c.definition}` : c.label); };
      list.append(b);
    }
    el.append(list);
  }
  scroll();
  if (remember) saveConversation();
}

const CONFIRM = "Say yes if this is correct; otherwise explain more.";
const YES = /^\s*(yes|y|yep|correct|that's right|right|ok|okay)\b[\s.!]*$/i;

const pause = ms => new Promise(r => setTimeout(r, ms));

// What the questioner writes: "yes" to a draft adds it; anything else goes to the agent, with the conversation so far.
async function draft(kind, text, animate = false) {
  if (kind !== "evidence" || state.loading || !state.session || panelBusy) return;
  const epoch = state.epoch;
  $("#e-words").value = "";
  $("#observation-error").textContent = "";
  setPanelBusy(true);
  const session = state.session;
  try {
    await say(kind, "user", text, undefined, animate);
    if (epoch !== state.epoch || session !== state.session) return;
    if (pending[kind] && YES.test(text)) { await addPending(kind, animate); return; }
    pending[kind] = null;
    $("#observation-status").textContent = "Interpreting the observation…";
    const d = await post("/api/session/draft", {assembly: state.ex.assembly.id, kind, text, history: talk[kind]});
    if (epoch !== state.epoch) return;
    talk[kind].push({role: "user", content: text});
    const reply = d.clarification ? d.clarification.question
      : d.draft ? `${formulation(kind, d.draft)}\n\n${CONFIRM}` : (d.note || "No draft was produced; try saying it another way.");
    talk[kind].push({role: "assistant", content: reply + (d.draft ? ` (draft: ${JSON.stringify(d.draft)})` : "")});
    if (d.draft) pending[kind] = d.draft;
    $("#observation-status").textContent = d.draft ? "Review the draft, then add the observation."
      : d.clarification ? "Please clarify the observation." : "";
    await say(kind, "agent", reply, d.clarification?.choices, animate);
  } catch (err) {
    if (epoch === state.epoch) {
      $("#observation-status").textContent = "";
      $("#observation-error").textContent = err.message;
      say(kind, "error", err.message);
    }
  }
  finally { if (epoch === state.epoch) { setPanelBusy(false); saveConversation(); } }
}

// ---- panel input wiring -------------------------------------------------------------------------------
for (const button of document.querySelectorAll("[data-observation-mode]"))
  button.onclick = () => { rememberObservationFields(); setObservationMode(button.dataset.observationMode); };
$("#observation-kind").onchange = () => {
  Object.assign(observationUI, {kind: $("#observation-kind").value, variable: "", value: ""});
  renderObservationFields(); updatePanelControls(); saveConversation();
};
$("#observation-variable").onchange = () => {
  Object.assign(observationUI, {variable: $("#observation-variable").value, value: ""});
  renderObservationFields(); updatePanelControls(); saveConversation();
};
for (const id of ["#observation-reading", "#observation-value", "#observation-source"])
  $(id).oninput = () => { rememberObservationFields(); saveConversation(); };
$("#observation-form").onsubmit = e => { e.preventDefault(); submitObservation(); };
$("#e-confirm").onclick = () => draft("evidence", "yes");
$("#e-words").oninput = () => saveConversation();

for (const form of document.querySelectorAll("#map-side .say")) form.onsubmit = e => {
  e.preventDefault();
  const text = form.querySelector("textarea").value.trim();
  if (text) draft(form.dataset.kind, text);
};
for (const t of document.querySelectorAll("#map-side .say textarea")) t.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); t.closest("form").requestSubmit(); }
});

async function agentStatus() {
  const epoch = state.epoch;
  agentReady = false;
  $("#agent-status").textContent = "Checking the observation agent…";
  updatePanelControls();
  try {
    const s = await getJSON("/api/chat-status");
    if (epoch !== state.epoch) return;
    agentReady = !!s.available;
    $("#agent-status").textContent = agentReady
      ? `Observation agent: ${s.provider} · ${s.model}`
      : `Agent chat unavailable (${s.reason}). You can still add observations with the dropdowns.`;
  } catch (err) { if (epoch === state.epoch) $("#agent-status").textContent = err.message; }
  finally { if (epoch === state.epoch) updatePanelControls(); }
}

// A BN node, clicked: its distribution given the session's evidence so far.
function nodeChart(d) {
  const W = 340, previous = d.previous;
  const key = `<div class="meta" style="margin-top:6px">` +
    (previous ? `<span style="color:var(--idle)">━</span> Previous round (${esc(previous.at)}) · ` : "") +
    `<span style="color:var(--accent)">━</span> Current round (${esc(d.at)})</div>`;
  const note = previous ? "" : `<div class="meta">No previous round recorded yet.</div>`;
  if (d.kind === "discrete") {
    const rowH = previous ? 34 : 22, H = d.states.length * rowH + 4, x0 = 90, bw = 150;
    return key + `<svg viewBox="0 0 ${W} ${H}" aria-label="Current and previous probability of each state">` + d.states.map((s, i) => {
      const y = i * rowH + 2;
      const bar = (round, offset, colour) =>
        `<rect x="${x0}" y="${y + offset + 2}" width="${bw * round.p[i]}" height="11" rx="2" style="fill:var(--${colour})"/>` +
        `<text x="${x0 + bw + 6}" y="${y + offset + 12}" font-size="11" style="fill:var(--${colour === "idle" ? "ink-2" : colour})">${round.p[i].toFixed(3)} ± ${(2 * round.se[i]).toFixed(3)}</text>`;
      return `<text x="${x0 - 6}" y="${y + (previous ? 21 : 13)}" text-anchor="end" font-size="12" style="fill:var(--ink-2)">${esc(s)}</text>` +
        (previous ? bar(previous, 0, "idle") : "") + bar(d, previous ? 15 : 0, "accent");
    }).join("") + `</svg>` + note;
  }
  const H = 130, pad = 18, e = d.ln_edges, lo = e[0], hi = e.at(-1);
  const top = Math.max(...d.density, ...(previous?.density || [])) || 1;
  const X = l => pad + (W - 2 * pad) * (l - lo) / (hi - lo), Y = v => H - 22 - (H - 34) * v / top;
  const curve = (round, colour) => {
    let path = `M${X(lo)},${Y(0)}`;
    round.density.forEach((v, i) => { path += ` L${X(e[i])},${Y(v)} L${X(e[i + 1])},${Y(v)}`; });
    path += ` L${X(hi)},${Y(0)} Z`;
    const m = X(Math.log(round.median_g));
    return `<path d="${path}" style="fill:var(--${colour});fill-opacity:0.25;stroke:var(--${colour})"/>` +
      `<line x1="${m}" x2="${m}" y1="${Y(0)}" y2="8" style="stroke:var(--${colour});stroke-dasharray:3 2"/>`;
  };
  const ticks = [0.01, 0.02, 0.03, 0.05, 0.07, 0.1, 0.15, 0.2, 0.3, 0.5, 0.7, 1, 1.5, 2, 3, 5]
    .filter(g => Math.log(g) >= lo && Math.log(g) <= hi);
  return key + `<svg viewBox="0 0 ${W} ${H}" aria-label="Current and previous density of the logarithm">` +
    (previous ? curve(previous, "idle") : "") + curve(d, "accent") +
    `<line x1="${pad}" x2="${W - pad}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--axis)"/>` +
    ticks.map(g => `<text x="${X(Math.log(g))}" y="${H - 6}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${g}</text>`).join("") +
    `</svg><div class="meta">Median: ` +
    (previous ? `<span style="color:var(--ink-2)">${previous.median_g.toFixed(3)} g</span> → ` : "") +
    `<span style="color:var(--accent)">${d.median_g.toFixed(3)} g</span></div>` + note;
}

async function showNodeDistribution(target) {
  const epoch = state.epoch;
  // A click on the BN: a node opens its distribution beside it; anywhere else closes it.
  const g = target?.closest?.("[data-tip=bnnode]"), pop = $("#node-pop");
  if (!g) { pop.hidden = true; return; }
  const id = g.dataset.id, s = state.session, r = g.getBoundingClientRect();
  pop.style.left = Math.max(12, Math.min(r.right + 12, innerWidth - 400)) + "px";
  pop.style.top = Math.max(8, Math.min(r.top - 10, innerHeight - 240)) + "px";
  pop.hidden = false;
  if (!s) { pop.innerHTML = `<b>${esc(id)}</b><p>Start the session in the Roadmap tab to see this node's distribution given the evidence.</p>`; return; }
  pop.innerHTML = `<b>${esc(id)}</b><p>Reading the samples…</p>`;
  try {
    const d = await getJSON(`/api/session/node?assembly=${encodeURIComponent(state.ex.assembly.id)}&node=${encodeURIComponent(id)}`);
    if (epoch !== state.epoch) return;
    pop.innerHTML = `<b>${esc(id)}</b>${d.observed ? " · observed" : ""}<div>as of discussion at ${esc(d.at)}</div>` +
      nodeChart(d) + (d.kind === "continuous" ? `<div class="meta">x: ${esc(d.unit)}, on a log scale</div>` : `<div class="meta">± 2 SE</div>`);
    pop.style.top = Math.max(8, Math.min(r.top - 10, innerHeight - pop.getBoundingClientRect().height - 8)) + "px";
  } catch (err) { if (epoch === state.epoch) pop.innerHTML = `<b>${esc(id)}</b><p>${esc(err.message)}</p>`; }
}
document.addEventListener("click", e => {          // the BN viewport's own clicks come through showNodeDistribution
  if (!e.target.closest("#node-pop, #bn-viewport")) $("#node-pop").hidden = true;
});
addEventListener("keydown", e => { if (e.key === "Escape") $("#node-pop").hidden = true; });

// ---- wiring ---------------------------------------------------------------------------------------------

const paneOn = name => $(`#pane-${name}`).classList.contains("on");
for (const b of document.querySelectorAll("nav button")) b.addEventListener("click", () => {
  for (const x of document.querySelectorAll("nav button")) x.classList.toggle("on", x === b);
  for (const p of document.querySelectorAll(".pane")) p.classList.toggle("on", p.id === `pane-${b.dataset.pane}`);
  const frame = $("#schema-frame");
  if (b.dataset.pane === "schema" && frame.dataset.src) { frame.src = frame.dataset.src; delete frame.dataset.src; }
  if (b.dataset.pane === "cliques") stackScripts();      // drawn while hidden, its scripts could not be measured
});
$("#example").addEventListener("change", e => load(e.target.value));
$("#run").addEventListener("click", () => run());
$("#stop").addEventListener("click", () => stopInference());
// A new session, and new memory: the current one is kept in records/sessions/archive/ by the server.
$("#new-session").addEventListener("click", () => run());
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
  if (state.ex) renderMap();                       // the base map follows the theme
});
document.addEventListener("change", e => {
  if (e.target.id !== "basemap") return;
  state.basemap = e.target.checked;
  store.set("basemap", state.basemap ? "on" : "off");
  renderMap();
});
// ---- real earthquakes: USGS ShakeMaps -----------------------------------------------------------------------
// A ShakeMap assembly (examples/<network>/shakemap.assembly.json) takes its ground motion from a real event's map.
// The Earthquakes panel lists every USGS ShakeMap since 1900, M4 or more, whose map reaches this network's
// bridges (a hundred or so at most, so all of them; one that reaches none cannot be run), and above that the last 30 days near every network, asked of USGS every 2 minutes;
// one that appears after the page opened is NEW. Picking one runs it. While a ShakeMap session is
// on screen, the page also asks whether USGS has revised that map, and offers the new version.

const SHAKEMAP = "hazard.shakemap", QUAKE_POLL_MS = 120000;
const quakes = { recent: null, error: "", seen: null, fresh: new Set(), unread: 0, history: null, historyFor: null,
                 historyError: "", revised: null, dismissed: new Set() };
const isShakemap = () => !!state.ex?.menu.settable.parameters.some(p => p.function === SHAKEMAP);
const quakeWhen = t => t ? String(t).replace("T", " ").slice(0, 16) + " UTC" : "time unknown";
const mag = m => m == null ? "M?" : `M${Number(m).toFixed(1)}`;

function shakemapSetting(name) {
  const p = state.ex?.menu.settable.parameters.find(x => x.function === SHAKEMAP && x.name === name);
  return currentScenario().parameters?.[SHAKEMAP]?.[name] ?? p?.value;
}

// Earthquakes belong to a ShakeMap example: a GMM one has a fixed scenario, so it shows no Earthquakes button,
// panel or new-earthquake notices (the page keeps polling, so switching to a ShakeMap example shows what came in).
function renderQuakeControls() {
  if (!state.ex) return;                         // still loading: leave the header as it was
  const on = isShakemap();
  $("#quakes-btn").hidden = !on;
  if (!on) closeQuakes();
  renderBadge(); renderNotices();
}

function renderQuakeLine() {
  const el = $("#quake-line");
  renderQuakeControls();
  if (!state.ex || !isShakemap()) { el.innerHTML = ""; return; }
  const m = state.session?.shakemap, pick = state.pick;
  let h;
  if (pick) h = `<span>Running USGS ShakeMap <b>${esc(pick.event_id)}</b>${pick.version ? ` v${esc(pick.version)}` : ""}: ` +
                `${esc(mag(pick.magnitude))} ${esc(pick.place || pick.description || "")}</span>`;
  else if (m) h = `<span>USGS ShakeMap <b>${esc(m.event_id)}</b> v${esc(m.version)}: <b>${esc(mag(m.magnitude))}</b> ` +
                  `${esc(m.description || "")}, ${esc(quakeWhen(m.time))} · ${m.seismic_stations ? `${m.seismic_stations} seismic stations`
                  : "no seismic stations (a ground-motion-model estimate)"} · ${esc(m.map_status || "")}, via ${esc(m.source || "?")}` +
                  `${m.covered != null && m.covered < m.sites ? ` · <span class="partial">map reaches ${m.covered} of ${m.sites} bridges; ` +
                    `the rest are given its edge value, an upper bound</span>` : ""}</span>`;
  else h = `<span>USGS ShakeMap <b>${esc(shakemapSetting("event_id"))}</b>: press Run to fetch it and sample, or choose another earthquake.</span>`;
  el.innerHTML = h + `<button type="button" data-open-quakes>Choose earthquake</button>`;
}

// The ShakeMap assembly to run an event with: this one if it can, else this network's, else the first.
function assemblyFor(ids) {
  const here = state.ex?.assembly.id, network = state.ex?.assembly.network;
  return ids.includes(here) ? here : ids.find(id => id.split("/")[0] === network) || ids[0];
}

async function openEvent(e, assemblies) {
  if (state.loading || panelBusy) { setStatus("Wait for the current computation to finish, or Stop it.", true); return; }
  closeQuakes();
  const id = assemblyFor(assemblies);
  if (!id) return;
  if (id !== state.ex?.assembly.id) {
    $("#example").value = id;
    await load(id);
    if (state.ex?.assembly.id !== id) return;
  }
  state.pick = { event_id: e.event_id, version: e.version ?? null, magnitude: e.magnitude, lat: e.lat, lon: e.lon,
                 depth_km: e.depth_km, place: e.place, description: e.description, time: e.time };
  quakes.fresh.delete(e.event_id);
  renderQuakeLine(); renderMap(); renderNotices();
  await run();
}

function quakeButton(e, assemblies, current) {
  const fresh = quakes.fresh.has(e.event_id);
  return `<button type="button" class="quake${current ? " current" : ""}" data-event="${esc(e.event_id)}" data-assemblies="${esc(assemblies.join(" "))}">` +
    `<span class="mag">${esc(mag(e.magnitude))}</span><span class="where" title="${esc(e.place || "")}">${esc(e.place || e.event_id)}` +
    `${fresh ? `<span class="new">NEW</span>` : ""}</span><span class="when">${esc(quakeWhen(e.time))} · ${esc(e.event_id)}` +
    `${e.covered != null && e.covered < e.sites ? ` · <span class="partial" title="The other bridges are given the map's edge value, an upper bound">` +
      `map reaches ${e.covered} of ${e.sites} bridges</span>` : ""}` +
    `${e.networks ? ` · ${esc(e.networks.join(", "))}` : ""}</span></button>`;
}

function shakemapAssemblyHere() {
  const network = state.ex?.assembly.network;
  return state.examples.find(x => x.shakemap && x.network === network)?.id;
}

function renderQuakes() {
  const el = $("#quakes"), current = state.session?.shakemap?.event_id;
  const byId = new Map();
  let h = `<h2>Last 30 days near the networks</h2>`;
  if (quakes.recent == null) h += `<p class="meta">${quakes.error ? `Could not ask USGS: ${esc(quakes.error)}` : "Asking USGS…"}</p>`;
  else if (!quakes.recent.length) h += `<p class="meta">None of M4 or more whose map reaches a network. USGS is asked again every 2 minutes.</p>`;
  else h += `<div class="list">${quakes.recent.map(e => { byId.set(e.event_id, e); return quakeButton(e, e.assemblies, e.event_id === current); }).join("")}</div>`;
  const here = shakemapAssemblyHere();
  if (here) {
    const network = state.ex.assembly.network;
    const list = quakes.historyFor === network ? quakes.history : null;
    h += `<h2>ShakeMaps reaching ${esc(network)} since 1900, M4 or more${list ? ` (${list.length})` : ""}</h2>`;
    h += `<div class="row"><input id="quake-id" placeholder="a USGS event id, e.g. ${esc(shakemapSetting("event_id") || "nc216859")}" aria-label="USGS event id">` +
         `<button type="button" id="quake-id-run">Run</button></div>`;
    const outside = list && quakes.historyOutside ? `<p class="meta">${quakes.historyOutside} more near ${esc(network)} are left out: ` +
      `their maps reach none of its bridges.</p>` : "";
    const partial = list?.some(e => e.covered != null && e.covered < e.sites) ? `<p class="meta">Where a map reaches only some bridges, ` +
      `the others are given its edge value: USGS maps reach to where shaking has faded to light, so that is an upper bound.</p>` : "";
    if (list) h += (list.length ? `<div class="list">${list.map(e => quakeButton(e, [here], e.event_id === current)).join("")}</div>`
                                : `<p class="meta">No ShakeMap of M4 or more reaches this network's bridges.</p>`) + partial + outside;
    else if (quakes.historyFor === network && quakes.historyError)
      h += `<p class="meta">Could not ask USGS: ${esc(quakes.historyError)}</p><button type="button" id="quake-history">Try again</button>`;
    else h += `<p class="meta">Asking USGS, and checking which bridges each map reaches…</p>`;
  } else {
    h += `<p class="meta">${esc(state.ex?.assembly.network || "This network")} has no ShakeMap assembly, so past events cannot be run here.</p>`;
  }
  const typed = $("#quake-id")?.value || "";
  el.innerHTML = h;
  if (typed && $("#quake-id")) $("#quake-id").value = typed;
  quakes.lookup = new Map([...byId, ...(quakes.history || []).map(e => [e.event_id, e])]);
}

// The network's whole ShakeMap catalogue, asked once per network while the page is open.
async function loadHistory() {
  const network = state.ex?.assembly.network;
  if (!shakemapAssemblyHere() || quakes.loadingFor === network || (quakes.historyFor === network && quakes.history)) return;
  quakes.loadingFor = network;
  let reply = null, error = "";
  try { reply = await getJSON(`/api/shakemap-events?network=${encodeURIComponent(network)}`); }
  catch (err) { error = err.message; }
  quakes.loadingFor = null;
  quakes.history = reply?.events ?? null; quakes.historyOutside = reply?.outside || 0;
  quakes.historyError = error; quakes.historyFor = network;
  if (!$("#quakes").hidden) renderQuakes();
}

function openQuakes() {
  quakes.unread = 0;
  renderBadge();
  renderQuakes();
  loadHistory();
  $("#quakes").hidden = false;
  $("#quakes-btn").setAttribute("aria-expanded", "true");
}
function closeQuakes() { $("#quakes").hidden = true; $("#quakes-btn").setAttribute("aria-expanded", "false"); }

function renderBadge() {
  const unread = isShakemap() ? quakes.unread : 0;
  $("#quakes-badge").textContent = unread ? String(unread) : "";
  document.title = unread ? `(${unread}) quakenet` : "quakenet";
}

function renderNotices() {
  let h = "";
  for (const id of isShakemap() ? quakes.fresh : []) {
    const e = quakes.recent?.find(x => x.event_id === id);
    if (!e || quakes.dismissed.has(id)) continue;
    h += `<div class="item"><span>New earthquake: <b>${esc(mag(e.magnitude))}</b> ${esc(e.place || id)}, ${esc(quakeWhen(e.time))}, ` +
         `near ${esc(e.networks.join(", "))}.</span><button type="button" data-event="${esc(id)}" data-assemblies="${esc(e.assemblies.join(" "))}">Run it</button>` +
         `<button type="button" data-dismiss="${esc(id)}">Dismiss</button></div>`;
  }
  const r = quakes.revised, m = state.session?.shakemap;
  if (r && m && r.event_id === m.event_id && r.version > m.version && !quakes.dismissed.has(`${r.event_id}@${r.version}`))
    h += `<div class="item"><span>USGS has revised ShakeMap <b>${esc(r.event_id)}</b>: version ${esc(r.version)} is out; ` +
         `this session used version ${esc(m.version)}.</span><button type="button" data-rerun="${esc(r.version)}">Re-run with version ${esc(r.version)}</button>` +
         `<button type="button" data-dismiss="${esc(`${r.event_id}@${r.version}`)}">Dismiss</button></div>`;
  $("#notice").innerHTML = h;
}

async function pollRecent() {
  try {
    const events = (await getJSON("/api/recent-earthquakes")).events;
    if (quakes.seen) for (const e of events) if (!quakes.seen.has(e.event_id)) { quakes.fresh.add(e.event_id); quakes.unread++; }
    quakes.seen = new Set([...(quakes.seen || []), ...events.map(e => e.event_id)]);
    quakes.recent = events;
    quakes.error = "";
  } catch (err) { quakes.error = err.message; }
  renderBadge(); renderNotices();
  if (!$("#quakes").hidden) renderQuakes();
}

async function checkShakemapVersion() {
  const m = state.session?.shakemap;
  if (!m) { quakes.revised = null; renderNotices(); return; }
  try {
    const now = await getJSON(`/api/shakemap-version/${encodeURIComponent(m.event_id)}`);
    if (state.session?.shakemap?.event_id === now.event_id) quakes.revised = now;
  } catch {}                                     // offline, or USGS busy: ask again on the next tick
  renderNotices();
}

$("#quakes-btn").addEventListener("click", () => $("#quakes").hidden ? openQuakes() : closeQuakes());
document.addEventListener("click", async e => {
  if (e.target.closest("[data-open-quakes]")) return openQuakes();
  const pick = e.target.closest("[data-event]");
  if (pick) {
    const ev = quakes.lookup?.get(pick.dataset.event) || quakes.recent?.find(x => x.event_id === pick.dataset.event);
    if (ev) return openEvent(ev, pick.dataset.assemblies.split(" ").filter(Boolean));
  }
  const dismiss = e.target.closest("[data-dismiss]");
  if (dismiss) { quakes.dismissed.add(dismiss.dataset.dismiss); quakes.fresh.delete(dismiss.dataset.dismiss); return renderNotices(); }
  const rerun = e.target.closest("[data-rerun]");
  if (rerun && state.session?.shakemap) return openEvent({...state.session.shakemap, version: Number(rerun.dataset.rerun)}, [state.ex.assembly.id]);
  if (e.target.id === "quake-history") {
    quakes.historyFor = null; quakes.historyError = "";
    renderQuakes();
    return loadHistory();
  }
  if (e.target.id === "quake-id-run") {
    const id = $("#quake-id").value.trim();
    if (id) return openEvent({event_id: id}, [shakemapAssemblyHere()]);
  }
  if (!$("#quakes").hidden && !e.target.closest("#quakes, #quakes-btn")) closeQuakes();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#quakes").hidden) closeQuakes();
  if (e.key === "Enter" && e.target.id === "quake-id") $("#quake-id-run").click();
});

// ---- the Map tab's dividers ------------------------------------------------------------------------------
// Each sets the width of the column to its right (--side-w, --results-w on #pane-map), by drag or arrow keys,
// within limits that keep the map at least MAP_MIN wide; double-click resets it. Widths are kept per browser.
const MAP_MIN = 320;
function divider(handle, name, fallback, min, room) {
  const pane = $("#pane-map"), prop = `--${name}`;
  const set = (w, keep) => {
    const width = Math.round(Math.max(min, Math.min(w, room())));
    pane.style.setProperty(prop, `${width}px`);
    handle.setAttribute("aria-valuenow", String(width));
    if (keep) store.set(`split.${name}`, String(width));
  };
  const current = () => parseFloat(getComputedStyle(pane).getPropertyValue(prop)) || fallback;
  const saved = Number(store.get(`split.${name}`));
  if (saved) pane.style.setProperty(prop, `${saved}px`);
  handle.setAttribute("aria-valuemin", String(min));
  handle.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const x0 = e.clientX, w0 = current();
    handle.classList.add("dragging"); document.body.classList.add("resizing");
    const move = ev => set(w0 + x0 - ev.clientX, false);
    const up = ev => {
      set(w0 + x0 - ev.clientX, true);
      handle.classList.remove("dragging"); document.body.classList.remove("resizing");
      handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up);
      handle.removeEventListener("pointercancel", up);
    };
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up);
    handle.addEventListener("pointercancel", up);
  });
  handle.addEventListener("keydown", e => {
    const step = e.shiftKey ? 64 : 16;
    if (e.key === "ArrowLeft") set(current() + step, true);
    else if (e.key === "ArrowRight") set(current() - step, true);
    else return;
    e.preventDefault();
  });
  handle.addEventListener("dblclick", () => { pane.style.removeProperty(prop); store.set(`split.${name}`, ""); });
}
divider($("#split-side"), "side-w", 340, 240, () => $("#map-wrap").clientWidth - 24 - 17 - MAP_MIN);
divider($("#split-results"), "results-w", 360, 260, () => {
  // What the map area needs: the map, its padding, and the side panels when they sit beside it.
  const beside = getComputedStyle($("#split-side")).display !== "none";
  return $("#pane-map").clientWidth - 9 - (MAP_MIN + 24 + (beside ? 17 + $("#map-side").offsetWidth : 0));
});

init().catch(err => setStatus(err.message, true));
pollRecent();
setInterval(() => { pollRecent(); checkShakemapVersion(); }, QUAKE_POLL_MS);
</script>
</body>
</html>
